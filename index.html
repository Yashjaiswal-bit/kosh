<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosh</title>
<meta name="description" content="A manual money tracker — accounts, card billing cycles, shared bills, ceilings and a live interest engine. Everything stays in your browser.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kosh">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="frame">
    <div class="phone" id="phone">

      <div class="statusbar">
        <span class="clock" id="clock">9:41</span>
        <div class="notch"></div>
        <div class="meters">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="9.2" y="3" width="3" height="9" rx="1"></rect><rect x="13.8" y="0" width="3" height="12" rx="1"></rect></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true"><rect x=".7" y=".7" width="19" height="10.6" rx="3" stroke="currentColor" stroke-opacity=".45"></rect><rect x="2.4" y="2.4" width="13" height="7.2" rx="1.6" fill="currentColor"></rect><path d="M21.6 4.2v3.6c1-.4 1.6-1 1.6-1.8s-.6-1.4-1.6-1.8Z" fill="currentColor" fill-opacity=".5"></path></svg>
        </div>
      </div>

      <div class="ksc scrollarea" id="scroll">
        <div class="screen" id="screen"></div>
      </div>

      <div class="tabwrap" id="tabwrap"></div>
      <div id="sheets"></div>
      <div id="toasts"></div>

    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
